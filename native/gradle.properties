# JDK 21 is required: app/build.gradle.kts targets jvmTarget 21, Gradle 8.10.2 cannot run on
# Java 24+, and AGP 8.8.0 does not support it. On Java 25 the build dies with a bare
# "What went wrong: 25.0.4.1" — that is the JDK version string, not a Kotlin error.
# If your default java is newer, point Gradle at a 21: org.gradle.java.home=/path/to/jdk-21
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
